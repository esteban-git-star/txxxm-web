<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" />
  <title>Tivim Support</title>
  <meta name="description" content="Schreib’s wie an WhatsApp – Installation, Fehlercodes, VPN. Feste Anleitungen, kein Raten." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tivim Support" />
  <meta property="og:description" content="Schreib einfach, was los ist. Wir führen dich durch unsere Anleitung." />
  <meta property="og:url" content="https://tivim-web.com/" />
  <meta property="og:image" content="https://tivim-web.com/preview.jpg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tivim" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css?v=3" />
  <link rel="stylesheet" href="support.css?v=4" />
  <link rel="stylesheet" href="app.css?v=6" />
  <link rel="stylesheet" href="site-nav.css?v=5" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="page-home">
  <div class="wrap">
    <button type="button" class="back" id="btnBack">Zurück</button>

    <div id="homeView">
      <header class="hero">
        <div class="logo" aria-hidden="true">T</div>
        <h1 class="q">Hi – brauchst du Hilfe?</h1>
        <p class="hint">Schreib einfach, was los ist. Wir führen dich durch unsere Anleitung.</p>
        <div class="server-status-container" id="server-status">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text" class="status-text">Schauen wir nach…</span>
        </div>
      </header>

      <form class="ask" id="askForm" autocomplete="off">
        <input
          id="askInput"
          type="text"
          enterkeyhint="go"
          placeholder="z.B. geht nix / Fehler 401 / ist down?"
          aria-label="Frage eingeben"
        />
        <button type="submit">Los</button>
      </form>

      <div class="chips" id="chips">
        <button type="button" class="chip" data-intent="status"><i data-lucide="activity" class="chip-ico" aria-hidden="true"></i> Läuft Tivim?</button>
        <button type="button" class="chip" data-intent="install-tv"><i data-lucide="tv" class="chip-ico" aria-hidden="true"></i> TV einrichten</button>
        <button type="button" class="chip" data-intent="pro-401"><i data-lucide="key-round" class="chip-ico" aria-hidden="true"></i> Fehler 401</button>
        <button type="button" class="chip" data-intent="pro-403"><i data-lucide="ban" class="chip-ico" aria-hidden="true"></i> Fehler 403</button>
        <button type="button" class="chip" data-intent="pro-codec"><i data-lucide="film" class="chip-ico" aria-hidden="true"></i> CodecException</button>
        <button type="button" class="chip" data-intent="xc-empty"><i data-lucide="list-x" class="chip-ico" aria-hidden="true"></i> Listen leer</button>
        <button type="button" class="chip" data-intent="vpn"><i data-lucide="shield" class="chip-ico" aria-hidden="true"></i> Ruckelt abends</button>
        <button type="button" class="chip" data-intent="install-mobile"><i data-lucide="smartphone" class="chip-ico" aria-hidden="true"></i> Handy</button>
      </div>

      <nav class="more">
        <p>Noch was?</p>
        <div class="more-grid">
          <a href="install.html"><i data-lucide="download" aria-hidden="true"></i> Installation</a>
          <a href="mehr.html"><i data-lucide="ellipsis" aria-hidden="true"></i> Mehr</a>
          <a href="wunschbox.html"><i data-lucide="message-square-plus" aria-hidden="true"></i> Wunschbox</a>
        </div>
      </nav>

      <div id="liveUpdates" class="live-updates is-hide" aria-live="polite"></div>
    </div>

    <div id="guideView" class="is-hide">
      <header class="guide-head">
        <h1 class="q" id="guideTitle"></h1>
        <p class="hint" id="guideLead"></p>
      </header>
      <div id="guideBody"></div>
      <div id="guideActions"></div>
    </div>
  </div>

  <script src="api-config.js?v=1"></script>
  <script src="kb.js?v=20260831-12"></script>
  <script src="assistant.js?v=20260831-13"></script>
  <script src="script.js?v=20260831-11"></script>
  <script src="update-format.js?v=1"></script>
  <script src="updates.js?v=5"></script>
  <script src="site-nav.js?v=5"></script>
  <script>
    if (typeof lucide !== "undefined") lucide.createIcons();
  </script>
</body>
</html>
