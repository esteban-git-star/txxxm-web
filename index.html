<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" />
  <title>Tivim Support</title>
  <meta name="description" content="Schreib’s wie an WhatsApp – Installation, Fehlercodes, VPN. Feste Anleitungen, kein Raten." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tivim Support" />
  <meta property="og:description" content="Schreib einfach, was los ist. Wir führen dich durch unsere Anleitung." />
  <meta property="og:url" content="https://tivim-web.com/" />
  <meta property="og:image" content="https://tivim-web.com/preview.jpg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#080706" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tivim" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css?v=8" />
  <link rel="stylesheet" href="support.css?v=17" />
  <link rel="stylesheet" href="app.css?v=18" />
  <link rel="stylesheet" href="site-nav.css?v=10" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="page-home">
  <div class="wrap">
    <button type="button" class="back" id="btnBack">Zurück</button>

    <div id="homeView">
      <header class="hero">
        <p class="brand">Tivim</p>
        <h1 class="q">Brauchst du Hilfe?</h1>
        <p class="hint">Schreib’s wie an WhatsApp – wir führen dich durch.</p>
      </header>

      <form class="ask" id="askForm" autocomplete="off">
        <input
          id="askInput"
          type="text"
          enterkeyhint="go"
          placeholder="z.B. Fehler 401 / geht nix / ruckelt"
          aria-label="Frage eingeben"
        />
        <button type="submit">Los</button>
      </form>

      <div class="list-group home-doors" id="homeDoors">
        <a class="list-row" href="install.html">
          <span class="list-copy">
            <strong>Neu einrichten</strong>
            <em>TV, Handy oder PC</em>
          </span>
          <span class="list-chevron" aria-hidden="true">›</span>
        </a>
        <button type="button" class="list-row" data-intent="probleme">
          <span class="list-copy">
            <strong>Läuft nicht</strong>
            <em>Fehler, App hängt, schwarz</em>
          </span>
          <span class="list-chevron" aria-hidden="true">›</span>
        </button>
        <button type="button" class="list-row" data-intent="vpn">
          <span class="list-copy">
            <strong>Ruckelt abends</strong>
            <em>Meist Leitung – VPN hilft</em>
          </span>
          <span class="list-chevron" aria-hidden="true">›</span>
        </button>
      </div>

      <p class="shortcuts-label">Oft gesucht</p>
      <div class="list-group list-group--compact" id="chips">
        <button type="button" class="list-row list-row--compact" data-intent="pro-401">
          <span class="list-copy"><strong>Fehler 401</strong></span>
          <span class="list-chevron" aria-hidden="true">›</span>
        </button>
        <button type="button" class="list-row list-row--compact" data-intent="pro-403">
          <span class="list-copy"><strong>Fehler 403</strong></span>
          <span class="list-chevron" aria-hidden="true">›</span>
        </button>
        <button type="button" class="list-row list-row--compact" data-intent="xc-empty">
          <span class="list-copy"><strong>Listen leer</strong></span>
          <span class="list-chevron" aria-hidden="true">›</span>
        </button>
        <button type="button" class="list-row list-row--compact" data-intent="epg">
          <span class="list-copy"><strong>EPG lädt nicht</strong></span>
          <span class="list-chevron" aria-hidden="true">›</span>
        </button>
      </div>

      <div id="liveUpdates" class="live-updates is-hide" aria-live="polite"></div>
    </div>

    <div id="guideView" class="is-hide">
      <header class="guide-head">
        <h1 class="q" id="guideTitle"></h1>
        <p class="hint" id="guideLead"></p>
      </header>
      <div id="guideBody"></div>
      <div id="guideActions"></div>
    </div>
  </div>

  <script src="api-config.js?v=3"></script>
  <script src="kb.js?v=20260907-7"></script>
  <script src="assistant.js?v=20260907-5"></script>
  <script src="script.js?v=20260907-3"></script>
  <script src="update-format.js?v=1"></script>
  <script src="updates.js?v=6"></script>
  <script src="site-nav.js?v=7"></script>
  <script>
    if (typeof lucide !== "undefined") lucide.createIcons();
  </script>
</body>
</html>
