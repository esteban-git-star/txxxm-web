<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0c0a09" />
  <title>Wunschbox – Tivim Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css?v=4" />
  <link rel="stylesheet" href="support.css?v=10" />
  <link rel="stylesheet" href="site-nav.css?v=6" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1 class="q">Wunschbox</h1>
      <p class="hint">Such deinen Film oder Serie. Cover und Termin siehst du direkt.</p>
    </header>

    <form class="wishbox-form" id="wishboxForm" novalidate>
      <section class="wishbox-panel" id="wishSearchPanel">
        <label class="wishbox-field wishbox-field--search">
          <span>Welcher Titel?</span>
          <div class="wish-search" id="wishSearchWrap">
            <input type="search" id="wishSearch" autocomplete="off" placeholder="z. B. One Piece, Dune …" enterkeyhint="search" />
            <p class="wish-search-hint is-hide" id="wishSearchLoading">Suche …</p>
            <ul class="wish-search-list is-hide" id="wishSearchList" role="listbox" aria-label="Suchergebnisse"></ul>
          </div>
        </label>

        <div class="wish-pick is-hide" id="wishPick" aria-live="polite">
          <div class="wish-pick-poster-wrap">
            <img class="wish-pick-poster is-hide" id="wishPickPoster" alt="" />
            <span class="wish-pick-poster wish-pick-poster--empty is-hide" id="wishPickPosterEmpty" aria-hidden="true"></span>
          </div>
          <div class="wish-pick-main">
            <span class="wish-pick-type" id="wishPickType"></span>
            <strong id="wishPickTitle"></strong>
            <p class="wish-pick-date" id="wishPickDate"></p>
          </div>
          <button type="button" class="wish-pick-clear" id="wishPickClear">Ändern</button>
        </div>

        <p class="wishbox-or">
          <button type="button" class="wishbox-link-btn" id="wishFreitextToggle">Freitext, wenn nichts passt</button>
        </p>
      </section>

      <section class="wishbox-panel is-hide" id="wishFreePanel">
        <label class="wishbox-field" id="wishFreeField">
          <span>Dein Wunsch</span>
          <textarea name="message" rows="3" maxlength="2000" placeholder="Titel schreiben – mindestens ein kurzer Satz"></textarea>
        </label>
        <button type="button" class="wishbox-link-btn" id="wishBackToSearch">← Zurück zur Suche</button>
      </section>

      <label class="wishbox-field">
        <span>Tivim-Username <em>(optional)</em></span>
        <input type="text" name="username" maxlength="80" autocomplete="username" placeholder="Falls du einen hast" />
      </label>

      <label class="wishbox-field is-hide" id="wishNoteField">
        <span>Zusatz <em>(optional)</em></span>
        <textarea name="note" rows="2" maxlength="500" placeholder="z. B. nur Staffel 1"></textarea>
      </label>

      <input type="text" name="website" class="wishbox-hp" tabindex="-1" autocomplete="off" aria-hidden="true" />

      <p class="wishbox-status" id="wishboxStatus" role="status" aria-live="polite"></p>

      <button type="submit" class="cta" id="wishboxSubmit" disabled>Wunsch abschicken</button>
    </form>

    <div class="note">
      <strong>Hinweis</strong>
      <p>Kein Support – nur Wünsche. Bei Problemen die <a href="kontakt.html">Support-Checkliste</a>.</p>
    </div>
  </div>
  <script>
    if (typeof lucide !== "undefined") lucide.createIcons();
  </script>
  <script src="api-config.js?v=1"></script>
  <script src="wunschbox.js?v=10"></script>
  <script src="site-nav.js?v=5"></script>
</body>
</html>
